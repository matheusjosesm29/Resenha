services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resenha
      POSTGRES_USER: resenha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resenha -d resenha"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build: .
    init: true
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: resenha
      POSTGRES_USER: resenha
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  postgres_data:
