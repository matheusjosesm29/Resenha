services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resenha
      POSTGRES_USER: resenha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resenha -d resenha"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: resenha
      POSTGRES_USER: resenha
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
